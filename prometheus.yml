global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'automoviles-service'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8889']
    
  - job_name: 'otel-collector'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']

rule_files:
  - 'alert.rules'
